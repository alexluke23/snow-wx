# ECMWF open data (IFS HRES line + IFS ENS plume): THIS IS NOW A REAL WORKFLOW — .github/workflows/ecmwf.yml (created on branch dev18, owner-authorized).
# This file stays only as the pointer and the operating notes; the old copy-paste snippet that lived here had a cleanup-loop bug and is gone.
#
# What the real workflow does (standalone: models.yml is untouched)
#   schedule  "40 9,11,21,23 * * *" (ACTIVE) + workflow_dispatch with a `force` input
#   concurrency  group `ecmwf`, cancel-in-progress false (never queues behind or cancels the model-map jobs)
#   steps     find the published cycle -> `python -m pipeline ecmwf --out out/models --published <tag> --github-output $GITHUB_OUTPUT`
#             -> tar `ecmwf-<YYYYMMDDHH>-<8hex>.tar` onto the `model-maps` prerelease -> delete only OLD ecmwf assets -> dispatch update-site.yml
#   fixed vs the old snippet: the cleanup loop is `if [ "$old" != "$asset" ]; then gh release delete-asset ...; fi` (the old `[ ... ] && gh ...` form ended the step with
#             status 1 when the new asset was the last item, which skipped the redeploy). tests/test_ecmwf_workflow.py runs the step under `bash -e` with a fake `gh`.
#   action versions are copied from models.yml (actions/checkout@v7, mamba-org/setup-micromamba@v3); a test keeps them identical.
#
# How the output reaches the site
#   ecmwf.yml -> release asset on `model-maps` -> update-site.yml (already unpacks every `<product>-<cycle>-<version>.tar`; ecmwf goes to build/models/ecmwf/)
#   -> `python -m pipeline build` runs multimodel.merge (HRES line + `plume: true`) -> the area page offers Models / Ensemble. The plume file
#   models/ecmwf/plume/<area>.json is fetched only when "Ensemble" is chosen.
#
# Status and monitoring
#   config ecmwf.enabled: true (dev18). The status page row "ECMWF forecasts" reads "not enabled" when the flag is false, "waiting for the first run" until a run is on the
#   site, then is judged against monitoring.sources.ecmwf.max_age_hours (30: two cycles a day, ~8 h release lag).
#
# Turning it off
#   - fastest: Actions tab -> "ECMWF (HRES + ENS)" -> "..." -> Disable workflow (the site keeps the last published run, the page greys it after 24 h);
#   - or set `ecmwf.enabled: false` in config/settings.yml and push (the job's CLI then exits 0 with new=false; the status row reads "not enabled").
#
# Cost (measured twice, Nov 18 2026): ~1.2 GB of anonymous byte-range GETs from the AWS mirror, 300-336 s on a laptop, 162 new files on the site (0.6 MB gzipped plume data).
# No secret and no API key. The mirror answers HTTP 503 "SlowDown" under bursts; pipeline/ecmwf.py retries with backoff and uses 6 workers.
