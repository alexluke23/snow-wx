# Rebuilds the website with fresh obs data every hour and publishes it to
# GitHub Pages. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#
# Model maps are rendered by models.yml and stored as release assets on the
# "model-maps" prerelease; every build here downloads the newest one per model,
# so a deploy from either workflow always contains both obs and model maps.
name: Update site

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off the busy top of the hour)
  workflow_dispatch:        # "Run workflow" button; also triggered by models.yml
    inputs:
      simulate_failure:
        description: "TEST ONLY: make this source fail (snotel, asos, alerts, afd, avalanche) to exercise the stale / unavailable and monitoring paths. Blank = normal run."
        required: false
        default: ""
        type: string
  push:
    branches: [main]

permissions:
  contents: write   # forecast archive: create/update assets of the "verification" prerelease
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Unit tests
        shell: bash -el {0}
        run: pytest -q

      - name: Fetch model maps (newest run per model)
        # Never fails the build: without model tars the site deploys and the
        # viewer says no runs are published yet.
        run: |
          mkdir -p build/models "$RUNNER_TEMP/models"
          names=$(gh release view model-maps --json assets -q '.assets[].name' 2>/dev/null || true)
          for m in $(echo "$names" | sed -n -E 's/^([a-z0-9]+)-[0-9]{10}(-[0-9a-f]{8})?\.tar$/\1/p' | sort -u); do
            # newest first; fall back to an older asset if one vanished mid-update
            dest=build/models   # model maps; point forecasts and NOHRSC layers go under data/
            case "$m" in points|nohrsc|ndfd) dest=build/data ;; esac
            mkdir -p "$dest"
            for a in $(echo "$names" | grep -E "^${m}-[0-9]{10}(-[0-9a-f]{8})?\.tar$" | sort -r); do
              if gh release download model-maps -p "$a" -D "$RUNNER_TEMP/models" --clobber \
                 && tar -C "$dest" -xf "$RUNNER_TEMP/models/$a"; then
                echo "model maps: $a"; break
              fi
              echo "::warning::could not fetch $a"
            done
          done

      - name: Restore the previous good SNOTEL copy from the live site
        # During an NRCS outage the build keeps the last good observations (flagged stale, ORIGINAL timestamps,
        # at most snotel.max_age_hours old). A fresh runner has no previous output, so fetch it from the live
        # site (SITE_ORIGIN or config site.origin). Never fails the build: no copy = "unavailable".
        continue-on-error: true
        shell: bash -el {0}
        run: python -m pipeline restore --out build/data

      - name: Build site and fetch data
        shell: bash -el {0}
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure || '' }}
        run: python -m pipeline build --out build

      - name: Size guard
        shell: bash -el {0}
        run: |
          limit=$(python -c "import yaml; print(yaml.safe_load(open('config/models.yml'))['budget']['max_site_mb'])")
          size=$(du -sm build | cut -f1)
          echo "site size: ${size} MB (limit ${limit} MB; GitHub Pages max 1 GB)"
          du -sm build/* | sort -rn | head
          if [ "$size" -gt "$limit" ]; then echo "::error::site is ${size} MB > ${limit} MB"; exit 1; fi

      - name: Forecast archive (verification release)
        # M9 prep (docs/verification.md): append this build's NBM/NDFD forecasts (every
        # 24/72-h window ending 12Z) and SNOTEL 12Z depth/SWE to monthly CSVs on the
        # "verification" prerelease. Existing monthly files are downloaded and merged
        # before they are replaced; state.json skips cycles already archived. Never
        # blocks the deploy.
        continue-on-error: true
        shell: bash -el {0}
        run: python -m pipeline archive --data build/data

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  monitor:
    # Data-health issues (one per unhealthy source, assigned to the owner; closed on recovery). Runs AFTER the
    # deploy, never blocks it, and cannot fail the workflow: continue-on-error + the script always exits 0.
    needs: [build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check source health (live meta.json) and update issues
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user pyyaml || true
          python3 -m pipeline.monitor || true
      - name: Heartbeat ping (dead-man's switch)
        # Tells an external service (e.g. Healthchecks.io) that the hourly build AND deploy succeeded; the service
        # e-mails the owner when the pings stop, which also catches a GitHub scheduler that never starts this
        # workflow (docs/specs/data-pipeline.md 5.2c). Does nothing unless the repository secret HEALTHCHECK_URL
        # exists; never fails the job or the deploy.
        if: ${{ needs.deploy.result == 'success' }}
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then curl -fsS -m 10 --retry 3 -o /dev/null "$HC_URL" || true; else echo "no HEALTHCHECK_URL secret: heartbeat skipped"; fi
