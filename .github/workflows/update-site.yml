# Rebuilds the website with fresh data every hour and publishes it to
# GitHub Pages. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Update site

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off the busy top of the hour)
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Unit tests
        shell: bash -el {0}
        run: pytest -q

      - name: Build site and fetch data
        shell: bash -el {0}
        run: python -m pipeline build --out build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
