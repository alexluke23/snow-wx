# Rebuilds the website with fresh obs data every hour and publishes it to
# GitHub Pages. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#
# Model maps are rendered by models.yml and stored as release assets on the
# "model-maps" prerelease; every build here downloads the newest one per model,
# so a deploy from either workflow always contains both obs and model maps.
name: Update site

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 UTC (off the busy top of the hour)
  workflow_dispatch:        # "Run workflow" button; also triggered by models.yml
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Unit tests
        shell: bash -el {0}
        run: pytest -q

      - name: Fetch model maps (newest run per model)
        # Never fails the build: without model tars the site deploys and the
        # viewer says no runs are published yet.
        run: |
          mkdir -p build/models "$RUNNER_TEMP/models"
          names=$(gh release view model-maps --json assets -q '.assets[].name' 2>/dev/null || true)
          for m in $(echo "$names" | sed -n 's/^\([a-z0-9]*\)-[0-9]\{10\}\.tar$/\1/p' | sort -u); do
            # newest first; fall back to an older asset if one vanished mid-update
            dest=build/models; [ "$m" = points ] && dest=build/data   # NBM point forecasts
            mkdir -p "$dest"
            for a in $(echo "$names" | grep -E "^${m}-[0-9]{10}\.tar$" | sort -r); do
              if gh release download model-maps -p "$a" -D "$RUNNER_TEMP/models" --clobber \
                 && tar -C "$dest" -xf "$RUNNER_TEMP/models/$a"; then
                echo "model maps: $a"; break
              fi
              echo "::warning::could not fetch $a"
            done
          done

      - name: Build site and fetch data
        shell: bash -el {0}
        run: python -m pipeline build --out build

      - name: Size guard
        shell: bash -el {0}
        run: |
          limit=$(python -c "import yaml; print(yaml.safe_load(open('config/models.yml'))['budget']['max_site_mb'])")
          size=$(du -sm build | cut -f1)
          echo "site size: ${size} MB (limit ${limit} MB; GitHub Pages max 1 GB)"
          du -sm build/* | sort -rn | head
          if [ "$size" -gt "$limit" ]; then echo "::error::site is ${size} MB > ${limit} MB"; exit 1; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
