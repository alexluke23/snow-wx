# Central configuration for the snow-wx pipeline.
# Most changes (adding states, tweaking windows, turning sources on/off)
# should only require editing this file.

region:
  name: Western US
  # Two-letter state codes used to select SNOTEL, ASOS and avalanche zones.
  states: [WA, OR, CA, NV, ID, MT, WY, UT, CO, AZ, NM]
  # [west, south, east, north] in degrees
  bbox: [-125.0, 31.0, -102.0, 49.5]
  map_center: [41.5, -113.0]   # [lat, lon]
  map_zoom: 5


snotel:
  enabled: true
  # Hours of hourly data to pull for charts and 24/72-hr change metrics.
  hours: 168
  # WTEQ = snow water equivalent, SNWD = snow depth, PREC = accumulated
  # water-year precip, TOBS = observed air temperature.
  elements: [WTEQ, SNWD, PREC, TOBS]
  # Stations per AWDB /data request (keeps responses a reasonable size).
  chunk_size: 40
  # Hide "% of median SWE" when the median itself is below this (inches).
  # Early-season medians are tiny, so 0.7" vs 0.175" would read as 400%.
  min_median_swe_in: 1.0
  # Outage handling (the NRCS AWDB service can be down for days): a one-station health probe fails fast,
  # the whole fetch has a hard time limit, and three failed chunks in a row stop the run. A down source
  # keeps the previous good copy only while its latest observation is younger than max_age_hours
  # (ORIGINAL timestamps, flagged stale); older data is removed and shown as "unavailable".
  probe_timeout_s: 10
  max_seconds: 600
  max_consecutive_chunk_failures: 3
  max_age_hours: 48


asos:
  enabled: true
  # Observations older than this are flagged as stale on the map.
  stale_minutes: 180


avalanche:
  enabled: true
  # Decimal places kept for zone polygon coordinates (4 ~ 10 m). Smaller
  # numbers make the GeoJSON file smaller.
  coord_precision: 4


http:
  # Data providers appreciate a descriptive User-Agent (api.weather.gov asks for one).
  user_agent: "snow-wx/0.2 (+https://github.com/alexluke23/snow-wx)"
  timeout: 60


cache:
  # Local disk hygiene: at the start of every `python -m pipeline ...` run, delete
  # data_cache files older than this (per-cycle GRIB/NBM/NDFD/NOHRSC downloads).
  prune_days: 2
  # Slow lookup caches that are kept (3DEP + api.weather.gov lookups, OpenSkiMap seeds).
  keep: [catalog, openskimap]


ingest:
  # Data-only ingest (`python -m ingester`, docs/specs/ingest-r2.md): sources -> output_dir/stage (data/ + models/) -> derive -> output_dir/store.
  # output_dir is relative to the folder the command is run from (-o / --output overrides it).
  # The default store is a local folder with exactly the R2 key layout (<layout>/data/..., <layout>/models/..., <layout>/_manifest.json).
  # R2 is used only with `--store r2` (or INGEST_STORE=r2) and R2_* credentials from the environment / Docker secrets; never from this file.
  output_dir: output
  layout: v1
  archive: false            # true = also copy each CHANGED object to archive/runs/<stamp>/ (doubles writes for changed files)


gefs:
  # NOAA GEFS ensemble plume (pipeline/gefs.py, `python -m pipeline gefs`): control + 30 perturbed members (count read from the data), 0.25 degree, liquid + a snow estimate.
  # ON since dev21 (owner-authorized .github/workflows/gefs.yml, 06:10/08:10/18:10/20:10 UTC) after the offline tests and a real end-to-end run (00Z Nov 20: 376 MB, 275 s,
  # 0 missing; a retry of the same cycle resumed 40/40 steps from data_cache/gefs). false = the job does nothing and the status row reads "not enabled".
  enabled: true
  cycles: [0, 12]
  step_h: 6
  max_step_h: 240
  stale_hours: 24


ecmwf:
  # ECMWF open data (CC BY 4.0) at ski-area summits: IFS HRES line in "Precipitation by model" + IFS ENS plume (pipeline/ecmwf.py, `python -m pipeline ecmwf`).
  # LIVE since dev18: .github/workflows/ecmwf.yml (standalone, schedule: hourly at :50, 08-13 and 20-01 UTC, from the measured +7.75 h release) runs it; set false to stop the job's work (the status page then reads
  # "not enabled"). `--force` runs it by hand even when false. The 0.25 degree ENS files carry 50 perturbed members and no control; the count is read from the data.
  enabled: true
  cycles: [0, 12]
  step_h: 6
  max_step_h: 240
  stale_hours: 24


aifs:
  # ECMWF AIFS Single (AI model, CC BY 4.0) total precipitation as one more, EXPERIMENTAL line in "Precipitation by model" (dev20). Fetched INSIDE `pipeline ecmwf`
  # (no new workflow) after the HRES/ENS files are written, with its own fetcher and a time budget: a failure is recorded in the fetch health, never raised.
  # in_badge: false keeps it out of the model-agreement badge (an unverified ML model would tilt a heuristic that is not verified either; docs/specs/multi-model.md).
  # ON since dev20 after the live validation (9 of 9 values match an independent read); false drops the line (status row: "not enabled").
  enabled: true
  in_badge: false
  max_seconds: 180


hazards:
  # NWS winter hazards layer on the obs map (dev13 item 2). enabled: false removes the layer (reversible). The product LIST
  # is built from the service's current product names (pipeline/hazards.py -> data/hazards.json) with these patterns; the
  # browser draws the live official polygons and falls back to our own alerts index (with a notice) if the service fails.
  enabled: true
  service: "https://mapservices.weather.noaa.gov/eventdriven/rest/services/WWA/watch_warn_adv/MapServer"
  layer: 1
  include: ["winter storm", "winter weather", "blizzard", "ice storm", "freezing rain", "freezing drizzle", "snow squall",
            "lake effect snow", "heavy snow", "wind chill", "extreme cold", "cold weather", "freezing fog", "high wind",
            "wind advisory", "brisk wind", "lake wind", "avalanche"]
  exclude: ["marine", "gale", "^storm warning", "hurricane", "freezing spray", "surf", "extreme wind"]


powder_quality:
  # THE one powder-quality definition (owner Nov 17), a documented heuristic on NBM's snow-to-liquid ratio (SLR). Used by the
  # pipeline, the SLR/powder panel, the Finder and My mountains "Type", the Daily summary rules and about.html.
  # web/js/colors.js POWDER_Q must equal these two numbers (tests/test_points.py checks).
  dense_below: 10     # SLR < 10:1 -> Dense
  blower_at: 15       # SLR >= 15:1 -> Blower; between -> Medium
  wind_gust_mph: 30   # summit gusts during snowfall at/above this -> "wind-affected"
  min_snow_in: 0.5    # no quality for periods with less snow than this

wind_exposure:
  # W7 Phase A (pipeline/wind_exposure.py, docs/specs/wind-exposure.md): an INFORMATIONAL "wind-affected snow likely" flag, never an avalanche
  # rating. BUILT BEHIND THIS FLAG; do NOT enable before an avalanche-literate reviewer has signed the checklist in the spec. While false,
  # no point file carries a `wind_exposure` field and the page renders nothing.
  enabled: false
  sustained_mph: 25      # [thresholds to tune after M9]
  gust_mph: 35
  min_window_snow_in: 0.2
  min_episode_snow_in: 0.5
  after_h: 12
  min_windy_hours: 2
  horizon_h: 72

