[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-wx-ingester"
version = "0.1.0"
description = "Fetch snow and weather data and store it as JSON in a local folder or Cloudflare R2"
requires-python = ">=3.12"
# Standalone: the fetch code (src/ingester/fetch) is vendored here. The GRIB, map and model packages (eccodes, cfgrib,
# herbie-data, cartopy) come from environment.yml (conda); pip installs the rest.
dependencies = [
    "boto3",
    "pyyaml",
    "requests",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pillow",
    "shapely",
    "pyproj",
    "netcdf4",
]

[tool.setuptools.packages.find]
where = ["src"]
