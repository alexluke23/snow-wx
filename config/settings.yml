# Central configuration for the snow-wx pipeline.
# Most changes (adding states, tweaking windows, turning sources on/off)
# should only require editing this file.

region:
  name: Western US
  # Two-letter state codes used to select SNOTEL, ASOS and avalanche zones.
  states: [WA, OR, CA, NV, ID, MT, WY, UT, CO, AZ, NM]
  # [west, south, east, north] in degrees
  bbox: [-125.0, 31.0, -102.0, 49.5]
  map_center: [41.5, -113.0]   # [lat, lon]
  map_zoom: 5

snotel:
  enabled: true
  # Hours of hourly data to pull for charts and 24/72-hr change metrics.
  hours: 168
  # WTEQ = snow water equivalent, SNWD = snow depth, PREC = accumulated
  # water-year precip, TOBS = observed air temperature.
  elements: [WTEQ, SNWD, PREC, TOBS]
  # Stations per AWDB /data request (keeps responses a reasonable size).
  chunk_size: 40
  # Hide "% of median SWE" when the median itself is below this (inches).
  # Early-season medians are tiny, so 0.7" vs 0.175" would read as 400%.
  min_median_swe_in: 1.0

asos:
  enabled: true
  # Observations older than this are flagged as stale on the map.
  stale_minutes: 180

avalanche:
  enabled: true
  # Decimal places kept for zone polygon coordinates (4 ~ 10 m). Smaller
  # numbers make the GeoJSON file smaller.
  coord_precision: 4

http:
  # Data providers appreciate a descriptive User-Agent (api.weather.gov asks for one).
  user_agent: "snow-wx/0.2 (+https://github.com/alexluke23/snow-wx)"
  timeout: 60

cache:
  # Local disk hygiene: at the start of every `python -m pipeline ...` run, delete
  # data_cache files older than this (per-cycle GRIB/NBM/NDFD/NOHRSC downloads).
  prune_days: 2
  # Slow lookup caches that are kept (3DEP + api.weather.gov lookups, OpenSkiMap seeds).
  keep: [catalog, openskimap]

archive:
  # Forecast archive for verification (docs/verification.md): monthly CSVs on this release.
  release: verification

snow_type:
  # Heuristic snow type from NBM's snow-to-liquid ratio (SLR), shown per day/night period
  # on forecast pages, My mountains and Powder Finder (owner S10). Labelled as a heuristic.
  wet_max: 8          # SLR < 8:1 -> Wet/heavy
  average_max: 12     # 8-12 -> Average
  dry_max: 18         # 12-18 -> Dry/light; >= 18 -> Very dry/blower
  wind_gust_mph: 30   # summit gusts during snowfall at/above this -> "wind-affected"
  min_snow_in: 0.5    # no type for periods with less snow than this
