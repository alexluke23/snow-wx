# Central configuration for the snow-wx pipeline.
# Most changes (adding states, tweaking windows, turning sources on/off)
# should only require editing this file.

region:
  name: Western US
  # Two-letter state codes used to select SNOTEL, ASOS and avalanche zones.
  states: [WA, OR, CA, NV, ID, MT, WY, UT, CO, AZ, NM]
  # [west, south, east, north] in degrees
  bbox: [-125.0, 31.0, -102.0, 49.5]
  map_center: [41.5, -113.0]   # [lat, lon]
  map_zoom: 5

snotel:
  enabled: true
  # Hours of hourly data to pull for charts and 24/72-hr change metrics.
  hours: 168
  # WTEQ = snow water equivalent, SNWD = snow depth, PREC = accumulated
  # water-year precip, TOBS = observed air temperature.
  elements: [WTEQ, SNWD, PREC, TOBS]
  # Stations per AWDB /data request (keeps responses a reasonable size).
  chunk_size: 40
  # Hide "% of median SWE" when the median itself is below this (inches).
  # Early-season medians are tiny, so 0.7" vs 0.175" would read as 400%.
  min_median_swe_in: 1.0
  # Outage handling (the NRCS AWDB service can be down for days): a one-station health probe fails fast,
  # the whole fetch has a hard time limit, and three failed chunks in a row stop the run. A down source
  # keeps the previous good copy only while its latest observation is younger than max_age_hours
  # (ORIGINAL timestamps, flagged stale); older data is removed and shown as "unavailable".
  probe_timeout_s: 10
  max_seconds: 600
  max_consecutive_chunk_failures: 3
  max_age_hours: 48

asos:
  enabled: true
  # Observations older than this are flagged as stale on the map.
  stale_minutes: 180

avalanche:
  enabled: true
  # Decimal places kept for zone polygon coordinates (4 ~ 10 m). Smaller
  # numbers make the GeoJSON file smaller.
  coord_precision: 4

http:
  # Data providers appreciate a descriptive User-Agent (api.weather.gov asks for one).
  user_agent: "snow-wx/0.2 (+https://github.com/alexluke23/snow-wx)"
  timeout: 60

cache:
  # Local disk hygiene: at the start of every `python -m pipeline ...` run, delete
  # data_cache files older than this (per-cycle GRIB/NBM/NDFD/NOHRSC downloads).
  prune_days: 2
  # Slow lookup caches that are kept (3DEP + api.weather.gov lookups, OpenSkiMap seeds).
  keep: [catalog, openskimap]

site:
  # Live site origin (override with the SITE_ORIGIN env var). `pipeline restore` reads the previous good SNOTEL copy
  # from here before every build. CHANGE AT THE W1 DOMAIN CUTOVER (docs/specs/hosting-seo.md).
  origin: "https://alexluke23.github.io/snow-wx"
  # The ONE place the public feedback address lives (owner Nov 17): the footer "Send feedback" link, "Report a bad summary" and
  # "Report a bust" all read it via data/meta.json -> web/js/site-config.js. No address is hard-coded in any page or script.
  # Empty = those links are hidden (no default address). Value = what the footer used before this change.
  # Folder the site is served from ("" = root; "/snow-wx" on GitHub Pages today). Pages emit scripts as "<base_path>/js/...", and
  # web/js/site-config.js loads data/meta.json relative to its own location, so nested pages (W2) work. Used by pages.py (W2).
  base_path: ""
  feedback_email: "alexluke2323@gmail.com"

pages:
  # W2 prerendered area pages (pipeline/pages.py, `python -m pipeline pages`). OFF until the domain/base path is decided and the
  # workflow runs the step after the points tar is unpacked; a partial state cannot change the live site while this is false.
  enabled: false

pwa:
  # W4 offline-first PWA (pipeline/pwa.py, `python -m pipeline pwa`). BUILD ONLY: never enable before the W1 domain move (installed users
  # would be stranded if the origin changes). kill: true = ship a worker that unregisters itself and clears every snowwx-* cache.
  enabled: false
  kill: false
  version: ""        # salt for the cache version (the version is also a hash of the shell files)

verification:
  # M9 scoring (tools/verify_forecasts.py) excludes SNOTEL observations inside this window (the NRCS AWDB outage; end = first CONFIRMED live
  # recovery, owner Nov 17) and any stale/unavailable observation.
  snotel_outage: {start: "2026-11-16T12:00Z", end: "2026-11-18T00:45Z"}

monitoring:
  # Data-health issues (pipeline/monitor.py, update-site.yml `monitor` job): one GitHub issue per source, assigned
  # below so GitHub e-mails the owner; closed automatically on recovery. Limits come from each source's REAL cadence:
  #   max_failures   = consecutive failed runs (hourly sources only; products have no failure count)
  #   max_age_hours  = hours since the last success / product time
  issue_label: data-health
  assignee: alexluke23
  sources:
    # obs sources: fetched by every hourly build
    alerts:    {max_failures: 3, max_age_hours: 6}
    afd:       {max_failures: 3, max_age_hours: 6}
    avalanche: {max_failures: 3, max_age_hours: 6}
    asos:      {max_failures: 3, max_age_hours: 6}
    hazards:   {max_failures: 3, max_age_hours: 6}
    snotel:    {max_failures: 3, max_age_hours: 6}     # NRCS updates hourly; outages are usually upstream
    # products made by models.yml jobs and merged at build time (age = the product's own generated_at)
    points:    {max_age_hours: 14}    # NBM points run 02/08/14/20 UTC (every 6 h) after a ~1.7 h model lag; two missed runs = 14 h
    ndfd:      {max_age_hours: 10}    # job every 3 h; NDFD itself updates hourly
    models:    {max_age_hours: 10}    # every 3 h (HRRR hourly cycles; newest model counts)
    nohrsc:    {max_age_hours: 30}    # snowfall analysis 6-hourly, SNODAS daily and late; unchanged runs keep the old time

hazards:
  # NWS winter hazards layer on the obs map (dev13 item 2). enabled: false removes the layer (reversible). The product LIST
  # is built from the service's current product names (pipeline/hazards.py -> data/hazards.json) with these patterns; the
  # browser draws the live official polygons and falls back to our own alerts index (with a notice) if the service fails.
  enabled: true
  service: "https://mapservices.weather.noaa.gov/eventdriven/rest/services/WWA/watch_warn_adv/MapServer"
  layer: 1
  include: ["winter storm", "winter weather", "blizzard", "ice storm", "freezing rain", "freezing drizzle", "snow squall",
            "lake effect snow", "heavy snow", "wind chill", "extreme cold", "cold weather", "freezing fog", "high wind",
            "wind advisory", "brisk wind", "lake wind", "avalanche"]
  exclude: ["marine", "gale", "^storm warning", "hurricane", "freezing spray", "surf", "extreme wind"]

archive:
  # Forecast archive for verification (docs/verification.md): monthly CSVs on this release.
  release: verification

powder_quality:
  # THE one powder-quality definition (owner Nov 17), a documented heuristic on NBM's snow-to-liquid ratio (SLR). Used by the
  # pipeline, the SLR/powder panel, the Finder and My mountains "Type", the Daily summary rules and about.html.
  # web/js/colors.js POWDER_Q must equal these two numbers (tests/test_points.py checks).
  dense_below: 10     # SLR < 10:1 -> Dense
  blower_at: 15       # SLR >= 15:1 -> Blower; between -> Medium
  wind_gust_mph: 30   # summit gusts during snowfall at/above this -> "wind-affected"
  min_snow_in: 0.5    # no quality for periods with less snow than this
