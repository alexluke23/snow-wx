# Every data source, library and service Snow-Wx uses, with its licence and the credit text it requires (PLAN §10).
# The ONE register behind the public Sources page (web/sources.html, generated by tools/gen_sources.py) and the privacy page's list of third-party requests.
# tests/test_sources.py fails when code or config mentions an external host that no entry covers, when an entry lacks a licence/credit, or when the page is stale.
#
# fields
#   id        short key                 name      what readers see             role   what we use it for (plain words)
#   kind      data | basemap | software | hosting | links
#   licence   plain-language licence    licence_url   where the terms are      credit   the credit text the licence or terms ask for (shown on the page)
#   hosts     every host the CODE or CONFIG talks to or links to (suffix match: "weather.gov" covers api.weather.gov)
#   browser   hosts the VISITOR'S BROWSER contacts by itself while a page loads or is used (privacy page; tests/ browser check `privacy` keeps this list honest)
#   browser_when   when that request happens
#   notes     owner-facing remarks ("verify" = confirm the terms before the public launch)
# Entries marked verify: true have terms that must be re-read or confirmed with the provider before Dec 18 (PLAN §10).
version: 1
ignore_hosts:     # mentioned in code but not a source: XML/RDF namespaces, our own pages, the code repository, licence texts
  - {host: schema.org, why: "JSON-LD vocabulary URL (structured data), not a request"}
  - {host: sitemaps.org, why: "XML namespace of sitemap.xml"}
  - {host: w3.org, why: "SVG/XML namespace"}
  - {host: creativecommons.org, why: "licence text link (CC BY 4.0), cited in the ECMWF credit"}
  - {host: github.io, why: "our own site address (site.origin)"}
  - {host: github.com, why: "our code repository, issue tracker and release assets (hosting)"}
  - {host: example.com, why: "test fixture"}
  - {host: example.test, why: "test fixture"}
  - {host: example, why: "test fixture"}
sources:
  - id: noaa-nws
    name: NOAA / National Weather Service
    kind: data
    role: "National Blend of Models (NBM) point forecasts, alerts, forecast discussions, winter hazards; links to the full NWS forecast; the NDFD forecast is fetched only for the verification archive"
    licence: "US Government work: public domain"
    licence_url: https://www.weather.gov/disclaimer
    credit: "Data: NOAA / National Weather Service"
    hosts: [weather.gov, noaa.gov, noaa-gefs-pds.s3.amazonaws.com, noaa-nbm-grib2-pds.s3.amazonaws.com, noaa-ndfd-pds.s3.amazonaws.com, noaa-hrrr-bdp-pds.s3.amazonaws.com, noaa-rrfs-pds.s3.amazonaws.com, noaa-gfs-bdp-pds.s3.amazonaws.com, mapservices.weather.noaa.gov]
    notes: "Model data comes from the NOAA Open Data Dissemination (NODD) buckets on AWS. api.weather.gov is called by OUR pipeline only (alerts, forecast discussions, the hazard text); since dev19 the visitor's browser never calls it. It asks for an identifying User-Agent; ours is generic (no e-mail address)."
  - id: noaa-gefs
    name: NOAA / NWS NCEP Global Ensemble Forecast System (GEFS)
    kind: data
    role: "The NOAA GEFS ensemble plume (Ensemble view, ECMWF ENS | NOAA GEFS switch): total precipitation and a snow estimate at ski-area summits, all members"
    licence: "US Government work: public domain"
    licence_url: https://www.weather.gov/disclaimer
    credit: "Data: NOAA / NWS National Centers for Environmental Prediction (NCEP) GEFS, via the NOAA Open Data Dissemination program"
    hosts: []
    notes: "Fetched by our pipeline only (.github/workflows/gefs.yml, byte ranges from noaa-gefs-pds.s3.amazonaws.com); the visitor's browser never contacts NOAA for it."
  - id: nws-hazards-map
    name: NOAA / National Weather Service winter-hazard map service
    kind: data
    role: "The shaded winter-weather warning, watch and advisory areas on the obs map"
    licence: "US Government work: public domain"
    licence_url: https://www.weather.gov/disclaimer
    credit: "Hazard areas: NOAA / National Weather Service"
    hosts: []
    browser: [mapservices.weather.noaa.gov]
    browser_when: "when the map loads with the NWS winter hazards layer on (the default on the obs map): map-image requests to NOAA (your IP address and the area you look at go to NOAA)"
  - id: nohrsc
    name: NOAA National Operational Hydrologic Remote Sensing Center (NOHRSC) and SNODAS
    kind: data
    role: "Snowfall analysis and SNODAS snow depth overlays and storm totals"
    licence: "US Government work: public domain"
    licence_url: https://www.nohrsc.noaa.gov/
    credit: "Snow analysis: NOAA NOHRSC (SNODAS via NSIDC)"
    hosts: [nohrsc.noaa.gov, noaadata.apps.nsidc.org]
  - id: nrcs-snotel
    name: USDA NRCS SNOTEL (AWDB)
    kind: data
    role: "Snow depth, snow water equivalent and temperature at 800+ SNOTEL stations"
    licence: "US Government work: public domain"
    licence_url: https://www.nrcs.usda.gov/
    credit: "SNOTEL data: USDA Natural Resources Conservation Service, National Water and Climate Center. Provisional data, subject to revision."
    hosts: [wcc.sc.egov.usda.gov, nrcs.usda.gov]
    verify: false
  - id: iem
    name: Iowa Environmental Mesonet (IEM)
    kind: data
    role: "Airport weather observations (ASOS/AWOS)"
    licence: "Free for any lawful use, including commercial (IEM's stated terms)"
    licence_url: https://mesonet.agron.iastate.edu/disclaimer.php
    credit: "Observations: Iowa Environmental Mesonet, Iowa State University"
    hosts: [agron.iastate.edu]
  - id: usgs
    name: U.S. Geological Survey (The National Map, 3DEP)
    kind: basemap
    role: "Shaded-relief, topo and imagery map tiles; ground elevation (3DEP) for ski-area base/summit heights"
    licence: "US Government work: public domain; please credit the USGS"
    licence_url: https://www.usgs.gov/information-policies-and-instructions/copyrights-and-credits
    credit: "Map tiles and elevation: U.S. Geological Survey, The National Map"
    hosts: [usgs.gov, nationalmap.gov]
    browser: [basemap.nationalmap.gov]
    browser_when: "every time the map loads: USGS tile requests (your IP address and the area you look at go to the USGS)"
  - id: avalanche-org
    name: avalanche.org and the regional avalanche centers
    kind: data
    role: "Avalanche danger ratings and links to each center's own forecast; shown unaltered, expired ratings greyed out"
    licence: "Public forecasts published by the avalanche centers through avalanche.org; commercial terms to be confirmed"
    licence_url: https://avalanche.org/
    credit: "Avalanche danger: avalanche.org and the local avalanche center (always read the center's full forecast)"
    hosts: [avalanche.org]
    verify: true
    notes: "PLAN §10: verify terms with avalanche.org / the Utah Avalanche Center before any change in how ratings are used (owner task)."
  - id: osm
    name: OpenStreetMap contributors and OpenSkiMap
    kind: data
    role: "Ski-area and lift geometry (our ski-area catalog), Sno-Park locations, the roads/towns reference layer"
    licence: "Open Database Licence (ODbL) 1.0: attribution required; derived databases shared alike"
    licence_url: https://www.openstreetmap.org/copyright
    credit: "© OpenStreetMap contributors (ODbL). Ski areas: OpenSkiMap."
    hosts: [openstreetmap.org, openskimap.org, overpass-api.de, overpass.kumi.systems]
    notes: "data/ski_areas.json and data/rec_points.json are derived databases: published under the ODbL (see the Sources page)."
  - id: openfreemap
    name: OpenFreeMap and OpenMapTiles
    kind: basemap
    role: "Vector roads and town names drawn over the relief map (the reference layer)"
    licence: "OpenMapTiles schema (BSD/CC BY 4.0) with OpenStreetMap data (ODbL); free, no key"
    licence_url: https://openfreemap.org/
    credit: "OpenFreeMap © OpenMapTiles, data from OpenStreetMap"
    hosts: [openfreemap.org, openmaptiles.org]
    browser: [tiles.openfreemap.org]
    browser_when: "when the reference layer is on (default): vector tile and style requests (your IP address and the area you look at go to OpenFreeMap)"
    notes: "Single volunteer-run service: backup plan is self-hosted PMTiles (PLAN §8.4)."
  - id: ecmwf
    name: ECMWF open data (IFS HRES and IFS ensemble)
    kind: data
    role: "Operational high-resolution forecast line and the 50-member ensemble plume in 'Precipitation by model'"
    licence: "Creative Commons Attribution 4.0 (CC BY 4.0); the data are ADAPTED here (point values, accumulations, percentiles across members)"
    licence_url: https://creativecommons.org/licenses/by/4.0/
    credit: 'Adapted from "ECMWF IFS 15-day Forecast Data" by ECMWF, licensed under CC BY 4.0 (creativecommons.org/licenses/by/4.0). See the ECMWF Terms of Use (apps.ecmwf.int/datasets/licences/general/).'
    hosts: [ecmwf.int, ecmwf-forecasts.s3.amazonaws.com, ecmwf-forecasts.s3.eu-central-1.amazonaws.com, storage.googleapis.com]
  - id: ecmwf-aifs
    name: ECMWF open data (AIFS Single, the AI model)
    kind: data
    role: "An experimental extra line in 'Precipitation by model' (total precipitation at ski-area summits); built dev20, shown only when config aifs.enabled is on; never part of the agreement rating by default"
    licence: "Creative Commons Attribution 4.0 (CC BY 4.0) and the ECMWF Terms of Use; the data are ADAPTED here (point values, converted to inches)"
    licence_url: https://creativecommons.org/licenses/by/4.0/
    credit: 'Adapted from ECMWF AIFS Single open data (Copyright ECMWF), licensed under CC BY 4.0 (creativecommons.org/licenses/by/4.0). See the ECMWF Terms of Use (apps.ecmwf.int/datasets/licences/general/).'
    hosts: [ecmwf.int, ecmwf-forecasts.s3.eu-central-1.amazonaws.com, storage.googleapis.com]
    notes: "Same open-data mirrors as IFS, fetched by our ECMWF job (pipeline/ecmwf.py), never by your browser. ECMWF publishes no fixed credit line for AIFS; the wording follows the IFS one."
  - id: usfs
    name: US Forest Service, state parks and land managers (Sno-Park information)
    kind: data
    role: "Names and permit-check links for Sno-Parks; we link to the land manager and do not copy their lists"
    licence: "US Government works are public domain; state pages are linked, not copied"
    licence_url: https://www.fs.usda.gov/
    credit: "Sno-Park information: US Forest Service and the state park agencies, linked on each page"
    hosts: [fs.usda.gov, oregon.gov, parks.wa.gov, ohv.parks.ca.gov, parksandrecreation.idaho.gov]
  - id: plotly
    name: Plotly.js
    kind: software
    role: "Charts (self-hosted from our own site since dev19: web/vendor/plotly-2.35.2/, version pinned, licence files included)"
    licence: MIT
    licence_url: https://github.com/plotly/plotly.js/blob/master/LICENSE
    credit: "Charts: Plotly.js (MIT)"
    hosts: []
    notes: "Self-hosted: no third-party request any more (the CDN request was the privacy audit's first removal candidate). Upgrading = replace the folder, the loaders and the pinned hash together."
  - id: analytics-providers
    name: Cookieless analytics (provider chosen by the owner; OFF today)
    kind: software
    role: "Visitor counts and a few named events, only when the owner switches analytics on (config analytics.enabled); no cookies, Do Not Track and Global Privacy Control honoured"
    licence: "Depends on the provider chosen: Plausible (AGPL, hosted or self-hosted), GoatCounter (EUPL), Cloudflare Web Analytics (Cloudflare terms)"
    licence_url: https://github.com/alexluke23/snow-wx/blob/main/docs/specs/launch-readiness.md
    credit: "Analytics: none today"
    hosts: [plausible.io, zgo.at, goatcounter.com, cloudflareinsights.com]
    notes: "NOT in the browser list while analytics is off. When enabled, add the provider host to `browser:` and update the privacy page: tests/test_analytics.py fails otherwise."
  - id: leaflet
    name: Leaflet, MapLibre GL JS and maplibre-gl-leaflet
    kind: software
    role: "The maps (served from our own site, vendored)"
    licence: "BSD-2-Clause (Leaflet), BSD-3-Clause (MapLibre GL JS), ISC (maplibre-gl-leaflet)"
    licence_url: https://github.com/Leaflet/Leaflet/blob/main/LICENSE
    credit: "Maps: Leaflet and MapLibre GL JS"
    hosts: []
  - id: python-libs
    name: Open-source Python libraries (Herbie, cfgrib, ecCodes, xarray, NumPy, SciPy, Matplotlib, Cartopy, MetPy, pandas)
    kind: software
    role: "Pipeline: model data download and decoding, map rendering"
    licence: "MIT, BSD and Apache-2.0 (each library's own licence)"
    licence_url: https://github.com/alexluke23/snow-wx/blob/main/environment.yml
    credit: "Built with open-source scientific Python"
    hosts: [naturalearthdata.com]
  - id: hosting
    name: GitHub (code, Actions, Pages) and Cloudflare (planned)
    kind: hosting
    role: "Builds the site every hour and serves it; stores model products as release assets"
    licence: "GitHub Terms of Service (public repository)"
    licence_url: https://docs.github.com/site-policy/github-terms/github-terms-of-service
    credit: ""
    hosts: []
    notes: "Planned move to a custom domain on Cloudflare Pages + R2 (W1); the privacy page must be updated then."
  - id: resort-websites
    name: Ski-area websites (the "Area website" link on each page)
    kind: links
    role: "Outbound links to each resort's own site; taken from OpenSkiMap/OpenStreetMap tags and corrected in config/ski_areas.yml where a link was dead"
    licence: "Not applicable: links only; the resort's terms apply once you leave Snow-Wx"
    licence_url: https://github.com/alexluke23/snow-wx/blob/main/config/ski_areas.yml
    credit: "Resort names and website links: © OpenStreetMap contributors (ODbL)"
    hosts: [rideboreal.com, meadowlarklakeresort.com, travelyosemite.com, sunrise.ski]
  - id: webcam-links
    name: Resort, state DOT, avalanche-center and Forest Service webcam pages
    kind: links
    role: "Outbound links only (config/webcams.yml); no webcam picture or page is loaded, embedded or cached by Snow-Wx"
    licence: "Not applicable: links to the providers' own sites; their terms apply once you leave Snow-Wx"
    licence_url: https://github.com/alexluke23/snow-wx/blob/main/config/webcams.yml
    credit: "Webcams belong to their providers"
    hosts: []        # the hosts live in config/webcams.yml; tests/test_sources.py covers them from there
